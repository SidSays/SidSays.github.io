<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add('js');</script>
  <meta name="theme-color" content="#0E0F11">

  {%- seo -%}
  {%- feed_meta -%}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,wght@0..100,300..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Qwitcher+Grypen:wght@700&text=Sid%20Sinha&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Siddharth Sinha",
    "alternateName": "Sid Sinha",
    "jobTitle": "Salesforce Enterprise Architect",
    "url": "https://sidsinha.com/",
    "image": "https://sidsinha.com/assets/img/sid-sinha.jpg",
    "sameAs": [
      "https://www.linkedin.com/in/siddharth-sinha/",
      "https://www.youtube.com/@SidSinha",
      "https://www.instagram.com/_sidsinha/",
      "https://www.facebook.com/siddharth.sinha8/",
      "https://x.com/Sid_Sinha8",
      "https://github.com/SidSays",
      "https://www.salesforce.com/trailblazer/sidsinha"
    ]
  }
  </script>
</head>

<body class="surface-{{ page.surface | default: 'dark' }}">

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-head">
    <div class="wrap head-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}">Sid Sinha</a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/music/' | relative_url }}"{% if page.nav == 'music' %} aria-current="page"{% endif %}>Music</a>
        <a href="{{ '/photography/' | relative_url }}"{% if page.nav == 'photography' %} aria-current="page"{% endif %}>Photography</a>
        <a href="{{ '/professional/' | relative_url }}"{% if page.nav == 'professional' %} aria-current="page"{% endif %}>Professional</a>
        <a href="{{ '/memoirs/' | relative_url }}"{% if page.nav == 'memoirs' %} aria-current="page"{% endif %}>Memoirs</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-foot">
    <div class="wrap foot-inner">
      <p class="foot-name">Sid Sinha</p>
      <nav class="foot-links" aria-label="Elsewhere">
        <a href="https://www.youtube.com/@SidSinha" rel="me noopener" target="_blank">YouTube</a>
        <a href="https://www.linkedin.com/in/siddharth-sinha/" rel="me noopener" target="_blank">LinkedIn</a>
        <a href="https://www.instagram.com/_sidsinha/" rel="me noopener" target="_blank">Instagram</a>
        <a href="https://www.facebook.com/siddharth.sinha8/" rel="me noopener" target="_blank">Facebook</a>
        <a href="https://x.com/Sid_Sinha8" rel="me noopener" target="_blank">X</a>
        <a href="https://github.com/SidSays" rel="me noopener" target="_blank">GitHub</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
      <p class="foot-legal">&copy; {{ 'now' | date: "%Y" }} Sid Sinha</p>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.querySelector('.nav-toggle');
      var nav = document.getElementById('site-nav');
      if (!btn || !nav) return;
      function setOpen(open) {
        btn.setAttribute('aria-expanded', String(open));
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Menu');
        nav.classList.toggle('is-open', open);
      }
      btn.addEventListener('click', function () {
        setOpen(btn.getAttribute('aria-expanded') !== 'true');
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();
  </script>
</body>
</html>
